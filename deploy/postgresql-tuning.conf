# PostgreSQL 16 settings for a 1 GB VM that also runs the BloodDonor JVM (about 500 MB) and Caddy.
# setup-vm.sh installs this as /etc/postgresql/16/main/conf.d/blooddonor-tuning.conf.
# Changing any of these needs: sudo systemctl restart postgresql

# Localhost only (also the Ubuntu default; db-setup.sql pins it with ALTER SYSTEM too).
listen_addresses = 'localhost'

# The server's pool uses 5 connections, Flyway 1-2 at start-up, plus pg_dump and psql.
max_connections = 20

shared_buffers = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 384MB
